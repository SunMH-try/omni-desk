[tool.poetry]
name = "openclaw-proactive-distribution-agent"
version = "0.1.0"
description = "OpenClaw Proactive Distribution Agent Subsystem B"
authors = ["Developer B"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.104.1"
uvicorn = "^0.24.0"
pydantic = "^2.5.2"
click = "^8.1.7"
httpx = "^0.25.2"
python-dotenv = "^1.0.0"
pyyaml = "^6.0.1"
jinja2 = "^3.1.2"
jsonschema = "^4.20.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-asyncio = "^0.21.1"
black = "^23.11.0"
flake8 = "^6.1.0"
mypy = "^1.7.1"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.click]
scripts = ["tkp_b = app.cli:cli"]
